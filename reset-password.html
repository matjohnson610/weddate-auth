<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WedDate - 重設密碼</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f8fafc;
    }
    .box {
      background: white;
      padding: 36px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      width: 340px;
      box-sizing: border-box;
    }
    h2 {
      font-size: 20px;
      color: #1e293b;
      margin: 0 0 16px;
      text-align: center;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled {
      background: #94a3b8;
    }
    #msg {
      margin-top: 14px;
      font-size: 14px;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>設定新密碼</h2>
    <input type="password" id="pass" placeholder="輸入新密碼 (至少 6 碼)" />
    <button id="btn" onclick="submitNewPassword()">更新密碼</button>
    <div id="msg"></div>
  </div>

  <script>
    const supabaseClient = window.supabase.createClient(
      'https://pwntkkpeanfaucfyckvf.supabase.co',
      'YOUR_SUPABASE_ANON_KEY'
    );

    async function submitNewPassword() {
      const pass = document.getElementById('pass').value;
      const msg = document.getElementById('msg');
      const btn = document.getElementById('btn');

      if (pass.length < 6) {
        msg.textContent = '密碼長度至少需 6 個字元';
        msg.style.color = '#dc2626';
        return;
      }

      btn.disabled = true;
      btn.textContent = '更新中...';

      const { error } = await supabaseClient.auth.updateUser({ password: pass });
      if (error) {
        msg.textContent = '重設失敗：' + error.message;
        msg.style.color = '#dc2626';
        btn.disabled = false;
        btn.textContent = '更新密碼';
      } else {
        msg.textContent = '密碼更新成功！請返回手機 App 使用新密碼登入。';
        msg.style.color = '#16a34a';
        btn.style.display = 'none';
        document.getElementById('pass').style.display = 'none';
      }
    }
  </script>
</body>
</html>
