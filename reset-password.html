<!doctype html>
<html lang="zh-HK">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>WedDate - 重設密碼</title>
        <!-- Load official Supabase client from CDN -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <style>
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                background-color: #f8fafc;
            }
            .card {
                background: white;
                padding: 36px 30px;
                border-radius: 16px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
                width: 100%;
                max-width: 360px;
                box-sizing: border-box;
                margin: 16px;
            }
            h2 {
                font-size: 22px;
                color: #1e293b;
                margin: 0 0 8px;
                text-align: center;
            }
            p.subtitle {
                font-size: 14px;
                color: #64748b;
                text-align: center;
                margin: 0 0 20px;
            }
            .form-group {
                margin-bottom: 14px;
            }
            label {
                display: block;
                font-size: 13px;
                font-weight: 600;
                color: #334155;
                margin-bottom: 6px;
            }
            input {
                width: 100%;
                box-sizing: border-box;
                padding: 12px;
                border: 1px solid #cbd5e1;
                border-radius: 8px;
                font-size: 15px;
                outline: none;
                transition: border-color 0.2s;
            }
            input:focus {
                border-color: #2563eb;
            }
            button {
                width: 100%;
                padding: 12px;
                background: #2563eb;
                color: white;
                border: none;
                border-radius: 8px;
                font-weight: 600;
                font-size: 15px;
                cursor: pointer;
                margin-top: 10px;
                transition: background 0.2s;
            }
            button:hover {
                background: #1d4ed8;
            }
            button:disabled {
                background: #94a3b8;
                cursor: not-allowed;
            }
            .error-msg {
                margin-top: 14px;
                font-size: 13px;
                color: #dc2626;
                line-height: 1.4;
                text-align: center;
            }
            .success-box {
                display: none;
                text-align: center;
            }
            .success-icon {
                font-size: 48px;
                color: #16a34a;
                margin-bottom: 12px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div id="formSection">
                <h2>設定新密碼</h2>
                <p class="subtitle">請為您的 WedDate 帳號設定新的登入密碼</p>

                <div class="form-group">
                    <label for="newPass">新密碼</label>
                    <input
                        type="password"
                        id="newPass"
                        placeholder="輸入新密碼"
                        autocomplete="new-password"
                    />
                </div>s

                <div class="form-group">
                    <label for="confirmPass">確認新密碼</label>
                    <input
                        type="password"
                        id="confirmPass"
                        placeholder="再次輸入新密碼"
                        autocomplete="new-password"
                    />
                </div>

                <button id="submitBtn" onclick="handlePasswordReset()">
                    更新密碼
                </button>
                <div id="errorText" class="error-msg"></div>
            </div>

            <!-- Shown only after successful reset -->
            <div id="successSection" class="success-box">
                <div class="success-icon">✓</div>
                <h2>密碼更新成功！</h2>
                <p style="color: #64748b; font-size: 15px; line-height: 1.5">
                    您的新密碼已生效。<br />請返回手機 WedDate 應用程式登入。
                </p>
            </div>
        </div>

        <script>
            // Initialize Supabase with your project endpoint and public Anon Key
            const SUPABASE_URL = "https://pwntkkpeanfaucfyckvf.supabase.co";
            const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"; // <-- Paste your Anon Key here

            const supabaseClient = window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY,
            );

            // Exact replica of your Flutter validator logic
            function validatePassword(text) {
                if (!text || text.length === 0) {
                    return "* 請輸入密碼";
                }
                if (text.length < 6) {
                    return "密碼長度至少需 6 個字元";
                }
                const hasUppercase = /[A-Z]/.test(text);
                const hasDigit = /\d/.test(text);
                const hasSpecial = /[^A-Za-z0-9]/.test(text);

                if (!hasUppercase || !hasDigit || !hasSpecial) {
                    return "* 必須包含至少 1 個大寫字母、1 個數字及 1 個特殊符號";
                }
                return null;
            }

            async function handlePasswordReset() {
                const newPass = document.getElementById("newPass").value;
                const confirmPass =
                    document.getElementById("confirmPass").value;
                const errorDiv = document.getElementById("errorText");
                const submitBtn = document.getElementById("submitBtn");

                errorDiv.textContent = "";

                // 1. Run Flutter-equivalent complexity validation
                const validationError = validatePassword(newPass);
                if (validationError) {
                    errorDiv.textContent = validationError;
                    return;
                }

                // 2. Ensure both inputs match
                if (newPass !== confirmPass) {
                    errorDiv.textContent = "* 兩次輸入的密碼不一致";
                    return;
                }

                // 3. UI feedback while request is pending
                submitBtn.disabled = true;
                submitBtn.textContent = "更新中...";

                try {
                    // Sends password update with the session token Supabase passed into the URL
                    const { data, error } =
                        await supabaseClient.auth.updateUser({
                            password: newPass,
                        });

                    if (error) {
                        errorDiv.textContent = "更新失敗: " + error.message;
                        submitBtn.disabled = false;
                        submitBtn.textContent = "更新密碼";
                    } else {
                        // Hide input form and show completion screen
                        document.getElementById("formSection").style.display =
                            "none";
                        document.getElementById(
                            "successSection",
                        ).style.display = "block";
                    }
                } catch (err) {
                    errorDiv.textContent = "發生連線錯誤，請稍後重試。";
                    submitBtn.disabled = false;
                    submitBtn.textContent = "更新密碼";
                }
            }
        </script>
    </body>
</html>
