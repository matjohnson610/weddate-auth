<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WedDate - 驗證成功</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f8fafc;
    }
    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      text-align: center;
      max-width: 360px;
      margin: 16px;
    }
    .icon {
      font-size: 48px;
      color: #16a34a;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      color: #1e293b;
      margin: 0 0 8px;
    }
    p {
      font-size: 15px;
      color: #64748b;
      line-height: 1.5;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>電子郵件驗證成功！</h1>
    <p>您的帳號已成功啟用，現在可以返回 WedDate 應用程式登入。</p>
  </div>

</html>
